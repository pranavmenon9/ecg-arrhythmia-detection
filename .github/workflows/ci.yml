name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Install dependencies (CPU PyTorch + API requirements + test tools)
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-app.txt pytest==9.1.1 httpx==0.28.1

      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ecg-api .

      - name: Run container and check it works
        run: |
          docker run -d --name ecg-api -p 8000:8000 ecg-api
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health
          echo
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d @app/sample_beat.json | tee response.json
          echo
          grep -q '"label":"Ventricular"' response.json

      - name: Show container logs on failure
        if: failure()
        run: docker logs ecg-api
